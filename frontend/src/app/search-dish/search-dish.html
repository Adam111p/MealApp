<form class="example-form" [formGroup]="clientForm" (ngSubmit)="search()">
  <mat-form-field class="example-full-width">
    <mat-label>Opisz na co masz ochotę</mat-label>
    <textarea
      formControlName="descriptionQuery"
      matInput
      placeholder="Coś mięsnego z ..."
    ></textarea>
  </mat-form-field>
  <button mat-flat-button color="primary" type="submit" [disabled]="clientForm.invalid">
    <mat-icon>save</mat-icon>
    szukaj
  </button>
</form>
<div class="menu-grid">
  @for (dish of menuService.dishes(); track dish.id) {
    <mat-card class="dish-card">
      <img mat-card-image [src]="'images/' + dish.fileName" [alt]="dish.name" class="dish-image" />
      <mat-card-header>
        <mat-card-title>{{ dish.name }}</mat-card-title>
        <!-- <mat-card-subtitle>Kuchnia Włoska</mat-card-subtitle> -->
      </mat-card-header>

      <mat-card-content>
        <p>{{ dish.description }}</p>
        <mat-chip-set>
          <mat-chip>{{ dish.price }} PLN</mat-chip>
        </mat-chip-set>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-flat-button color="primary" (click)="openDetails(dish)">
          <mat-icon>add_shopping_cart</mat-icon> DODAJ
        </button>
      </mat-card-actions>
    </mat-card>
  }
</div>
