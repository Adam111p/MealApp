<div class="search-wrapper">
  <div>
  <mat-card class="search-card">
    <form [formGroup]="clientForm" (ngSubmit)="search()" class="modern-form">
      <header class="form-header">
        <h2>Znajdź coś pysznego</h2>
        <p>Napisz, na co masz ochotę, a my zajmiemy się resztą.</p>
      </header>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Opisz swoje preferencje</mat-label>
        <textarea
          matInput
          formControlName="descriptionQuery"
          placeholder="np. Coś mięsnego z grillowanymi warzywami..."
          rows="4"
        ></textarea>
        <mat-icon matSuffix>restaurant</mat-icon>
        <mat-hint>Bądź tak szczegółowy, jak tylko chcesz!</mat-hint>
      </mat-form-field>

      <div class="actions">
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="clientForm.invalid"
          class="search-button"
        >
          <mat-icon>search</mat-icon>
          Szukaj posiłku
        </button>
      </div>
    </form>
  </mat-card>
  </div>
  <div class="menu-grid">
    @for (dish of menuService.dishes(); track dish.id) {
      <mat-card class="dish-card">
        <img
          mat-card-image
          [src]="'images/' + dish.fileName"
          [alt]="dish.name"
          class="dish-image"
        />
        <mat-card-header>
          <mat-card-title>{{ dish.name }}</mat-card-title>
          <!-- <mat-card-subtitle>Kuchnia Włoska</mat-card-subtitle> -->
        </mat-card-header>

        <mat-card-content>
          <p>{{ dish.description }}</p>
          <mat-chip-set>
            <mat-chip>{{ dish.price }} PLN</mat-chip>
          </mat-chip-set>
        </mat-card-content>

        <mat-card-actions align="end">
          <button mat-flat-button color="primary" (click)="openDetails(dish)">
            <mat-icon>add_shopping_cart</mat-icon> DODAJ
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</div>
